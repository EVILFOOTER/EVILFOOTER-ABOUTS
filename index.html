<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evil Footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000;
  --panel:#0a0a0a;
  --line:#1c1c1c;
  --text:#f2f2f2;
  --muted:#7a7a7a;
  --accent:#5b8cff;
  --disp:'Space Grotesk',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--mono);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:80px 20px;
  text-align:center;
  position:relative;
  overflow-x:hidden;
}
#snow{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}
body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(circle at 50% 35%,rgba(91,140,255,.035),transparent 38%);
}
body>*:not(#snow){position:relative;z-index:1}
a{text-decoration:none;color:inherit}

.logo-wrap{
  width:120px;height:120px;
  border-radius:50%;
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:0 0 0 6px rgba(255,255,255,.02),0 30px 60px rgba(0,0,0,.6);
  margin-bottom:26px;
}
.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}

h1{
  font-family:var(--disp);
  font-weight:700;
  font-size:26px;
  letter-spacing:.5px;
}
.sub{
  margin-top:10px;
  font-size:11.5px;
  letter-spacing:2px;
  color:var(--muted);
  text-transform:uppercase;
}

.cards{
  margin-top:56px;
  display:grid;
  grid-template-columns:repeat(2,minmax(150px,220px));
  gap:16px;
  width:100%;
  max-width:480px;
}
.card{
  background:rgba(10,10,10,.88);
  border:1px solid var(--line);
  border-radius:14px;
  padding:28px 16px;
  transition:border-color .25s,transform .25s,background .25s,box-shadow .25s;
  backdrop-filter:blur(4px);
}
.card:hover{
  border-color:var(--accent);
  background:#0d0f14;
  transform:translateY(-4px);
  box-shadow:0 12px 35px rgba(0,0,0,.45);
}
.card .n{
  font-size:10px;
  color:var(--muted);
  letter-spacing:2px;
}
.card .t{
  margin-top:10px;
  font-family:var(--disp);
  font-weight:600;
  font-size:15px;
  letter-spacing:.5px;
}
.card .arrow{
  margin-top:14px;
  font-size:12px;
  color:var(--accent);
}
footer{
  margin-top:60px;
  font-size:10.5px;
  color:#3f3f3f;
  letter-spacing:1px;
}
@media(max-width:420px){
  .cards{grid-template-columns:1fr 1fr;gap:12px}
  .card{padding:22px 10px}
}
</style>
</head>
<body>

<canvas id="snow"></canvas>

<div class="logo-wrap">
  <img src="https://i.ibb.co/RGYcMyws/MAX.jpg" alt="Evil Footer Logo">
</div>

<h1>EVIL FOOTER</h1>
<div class="sub">Arbab — Team Evil Footer</div>

<div class="cards" id="cards"></div>

<footer>© <span id="year"></span> Team Evil Footer</footer>

<script>
document.getElementById('year').textContent=new Date().getFullYear();

/* Display order: Profile 2, Profile 1, Profile 4, Profile 3 */
const PROFILES=[
  {label:'PROFILE 01',url:'https://evilfooter-profile2.netlify.app/'},
  {label:'PROFILE 02',url:'https://evilfooter-profile1.netlify.app/'},
  {label:'PROFILE 03',url:'https://evilfooter-profile4.netlify.app/'},
  {label:'PROFILE 04',url:'https://evilfooter-profile3.netlify.app/'}
];

document.getElementById('cards').innerHTML=PROFILES.map((p,i)=>`
  <a class="card" href="${p.url}" target="_blank" rel="noopener">
    <div class="n">${String(i+1).padStart(2,'0')}</div>
    <div class="t">${p.label}</div>
    <div class="arrow">visit ↗</div>
  </a>
`).join('');

/* Lightweight canvas snow */
const canvas=document.getElementById('snow');
const ctx=canvas.getContext('2d');
let width,height,dpr,flakes=[];

function resizeSnow(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  width=window.innerWidth;
  height=window.innerHeight;
  canvas.width=width*dpr;
  canvas.height=height*dpr;
  canvas.style.width=width+'px';
  canvas.style.height=height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const count=Math.min(170,Math.max(70,Math.floor(width*height/11000)));
  flakes=Array.from({length:count},()=>({
    x:Math.random()*width,
    y:Math.random()*height,
    r:Math.random()*1.35+.35,
    speed:Math.random()*.55+.18,
    drift:Math.random()*.35-.175,
    opacity:Math.random()*.5+.2,
    phase:Math.random()*Math.PI*2
  }));
}

function drawSnow(time){
  ctx.clearRect(0,0,width,height);

  for(const f of flakes){
    f.y+=f.speed;
    f.x+=f.drift+Math.sin(time*.0007+f.phase)*.08;

    if(f.y>height+5){
      f.y=-5;
      f.x=Math.random()*width;
    }
    if(f.x>width+5)f.x=-5;
    if(f.x<-5)f.x=width+5;

    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${f.opacity})`;
    ctx.fill();
  }

  requestAnimationFrame(drawSnow);
}

window.addEventListener('resize',resizeSnow);
resizeSnow();
requestAnimationFrame(drawSnow);
</script>

</body>
</html>
